name: Queue progression tests

on:
  pull_request:
    paths:
      - "railway/app/entrypoint.py"
      - "railway/app/services/queue_progression.py"
      - "railway/tests/test_queue_progression.py"
      - ".github/workflows/queue-progression-tests.yml"
  push:
    paths:
      - "railway/app/entrypoint.py"
      - "railway/app/services/queue_progression.py"
      - "railway/tests/test_queue_progression.py"
      - ".github/workflows/queue-progression-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: railway/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_queue_progression.py
