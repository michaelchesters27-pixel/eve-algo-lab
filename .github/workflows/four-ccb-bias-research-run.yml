name: 4CCB H1 bias discovery run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime requirements
        working-directory: railway
        run: pip install -r requirements.txt
      - name: Runtime import and route smoke test
        working-directory: railway
        env:
          TWELVE_DATA_API_KEY: dummy-key-123456
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-12345678901234567890
          ADMIN_TOKEN: dummy-admin-token-123456
        run: |
          python - <<'PY'
          from app.entrypoint import app
          paths = sorted(route.path for route in app.routes)
          wanted = '/api/research/4ccb-h1-bias/status'
          print('route count:', len(paths))
          print('bias route present:', wanted in paths)
          if wanted not in paths:
              raise SystemExit(f'missing route: {wanted}')
          PY
