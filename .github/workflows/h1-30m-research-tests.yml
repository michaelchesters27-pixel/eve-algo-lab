name: H1 30m research tests

on:
  pull_request:
    paths:
      - "railway/app/h1_30m_research.py"
      - "railway/app/h1_30m_research_api.py"
      - "railway/app/entrypoint.py"
      - "railway/tests/test_h1_30m_research.py"
      - "railway/Dockerfile"
      - "frontend/h1-30m-research.html"
      - "frontend/netlify/functions/api.mjs"
      - ".github/workflows/h1-30m-research-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_h1_30m_research.py
