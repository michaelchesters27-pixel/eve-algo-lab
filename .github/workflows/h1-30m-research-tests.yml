name: Algo Lab Backend CI

on:
  pull_request:
    paths:
      - "railway/**"
      - ".github/workflows/h1-30m-research-tests.yml"
  push:
    branches:
      - main
    paths:
      - "railway/**"
      - ".github/workflows/h1-30m-research-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: railway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: railway/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full backend suite
        run: pytest -q
