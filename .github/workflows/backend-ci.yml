name: Algo Lab Backend CI

on:
  pull_request:
    paths:
      - 'railway/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
      - agent/memory-hardening-v1
    paths:
      - 'railway/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: railway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: railway/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: pytest -q
